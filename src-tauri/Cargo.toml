[package]
name = "rollcat-md"
version = "0.3.1"
description = "rollcat-md — a lightweight Markdown reader and editor for Windows and Android."
authors = ["sonicacd"]
license = "Apache-2.0"
repository = "https://github.com/sonicacd/rollcatmd"
homepage = "https://github.com/sonicacd/rollcatmd"
edition = "2021"

[lib]
name = "rollcat_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
